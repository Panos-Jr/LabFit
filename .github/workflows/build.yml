name: Build LabFit

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older, now-pointless build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # one OS failing must not cancel the other two
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Pin SciPy < 1.15 to avoid the __thread_bss crash on M1 Macs
        pip install numpy "scipy<1.15" matplotlib PyQt5 pyinstaller
        # Mac needs pyobjc for the AppKit dock icon fix
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          pip install pyobjc-framework-Cocoa
        fi
        pip freeze   # shows exactly which versions this build used

    - name: Build with PyInstaller
      shell: bash
      run: |
        # --icon only sets the .exe/.app icon. labfit.py also loads app.ico at runtime
        # for the window icon, so it has to be bundled as data (PyInstaller 6 keeps data
        # in _internal/, so copying app.ico next to the exe does NOT work).
        if [ "${{ matrix.os }}" = "windows-latest" ]; then SEP=";"; else SEP=":"; fi

        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          # Windows A: single .exe
          pyinstaller --noconfirm --onefile --windowed --icon="app.ico" \
            --add-data "app.ico${SEP}." --name "LabFit" labfit.py
          # Windows B: folder build, zipped. Published as a second artifact so the two can be
          # timed side by side on a real lab PC (onefile unpacks ~120 MB to %TEMP% on every launch).
          pyinstaller --noconfirm --onedir --windowed --icon="app.ico" \
            --add-data "app.ico${SEP}." --name "LabFit" \
            --distpath dist_folder --workpath build_folder labfit.py
          python -c "import shutil; shutil.make_archive('dist/LabFit-Windows-folder', 'zip', 'dist_folder')"
        else
          # Mac/Linux: folder build (no temp-file extraction at launch)
          pyinstaller --noconfirm --onedir --windowed --icon="app.ico" \
            --add-data "app.ico${SEP}." --name "LabFit" labfit.py
        fi

    - name: Make Mac binary executable
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x dist/LabFit/LabFit

    - name: Zip Mac and Linux folders
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          zip -r LabFit-Mac-M1.zip LabFit
        else
          zip -r LabFit-Linux.zip LabFit
        fi

    - name: Upload Windows Artifact (single exe)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Windows
        path: dist/LabFit.exe
        if-no-files-found: error

    - name: Upload Windows Artifact (folder zip)
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Windows-folder
        path: dist/LabFit-Windows-folder.zip
        if-no-files-found: error

    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Mac-M1
        path: dist/LabFit-Mac-M1.zip
        if-no-files-found: error

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Linux
        path: dist/LabFit-Linux.zip
        if-no-files-found: error
