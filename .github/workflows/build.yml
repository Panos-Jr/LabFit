name: Build LabFit

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest] # Standard M1/M2 Mac runner

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # We MUST pin scipy < 1.15 to avoid the __thread_bss crash on M1 Macs
        pip install numpy "scipy<1.15" matplotlib PyQt5 pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller LabFit.spec

    - name: Fix Mac Binary (Make executable)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x dist/LabFit

    - name: Rename artifacts
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv dist/LabFit.exe dist/LabFit-Windows.exe
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          mv dist/LabFit dist/LabFit-Mac-M1
        else
          mv dist/LabFit dist/LabFit-Linux
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-${{ matrix.os }}
        path: |
          dist/LabFit-Windows.exe
          dist/LabFit-Mac-M1
          dist/LabFit-Linux
        if-no-files-found: ignore
