name: Build LabFit

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Pin SciPy < 1.15 to avoid the __thread_bss crash on M1 Macs
        pip install numpy "scipy<1.15" matplotlib PyQt5 pyinstaller
        # Mac needs pyobjc for the AppKit dock icon fix
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          pip install pyobjc-framework-Cocoa
        fi
        
    - name: Build with PyInstaller (Hybrid)
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          # Windows: OneFile (Instant load, bypasses Defender folder-scanning)
          pyinstaller --onefile --windowed --icon="app.ico" --name "LabFit" labfit.py
          cp app.ico dist/
        else
          # Mac/Linux: OneDir (Instant load, no temp-file extraction)
          pyinstaller --onedir --windowed --icon="app.ico" --name "LabFit" labfit.py
          cp app.ico dist/LabFit/
        fi

    - name: Make Mac binary executable
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x dist/LabFit/LabFit

    - name: Zip Mac and Linux folders
      if: matrix.os != 'windows-latest'
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          zip -r LabFit-Mac-M1.zip LabFit
        else
          zip -r LabFit-Linux.zip LabFit
        fi

    - name: Upload Windows Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Windows
        path: dist/LabFit.exe

    - name: Upload Mac Artifact
      if: matrix.os == 'macos-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Mac-M1
        path: dist/LabFit-Mac-M1.zip

    - name: Upload Linux Artifact
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-Linux
        path: dist/LabFit-Linux.zip
