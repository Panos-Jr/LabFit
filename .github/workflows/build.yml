name: Build LabFit

on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Pin SciPy < 1.15 to avoid the __thread_bss crash on M1 Macs
        pip install numpy "scipy<1.15" matplotlib PyQt5 pyinstaller
        
        # Mac needs pyobjc for the AppKit dock icon fix
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          pip install pyobjc-framework-Cocoa
        fi
        
    - name: Build with PyInstaller (OneDir)
      run: |
        pyinstaller --onedir --windowed --icon="app.ico" --name "LabFit" labfit.py
        # Copy the icon into the folder so the app can find it at runtime
        cp app.ico dist/LabFit/ 

    - name: Make Mac binary executable
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x dist/LabFit/LabFit

    - name: Zip the output folder
      shell: bash
      run: |
        cd dist
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          7z a -tzip LabFit-Windows.zip LabFit
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          zip -r LabFit-Mac-M1.zip LabFit
        else
          zip -r LabFit-Linux.zip LabFit
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-${{ matrix.os }}
        path: |
          dist/LabFit-Windows.zip
          dist/LabFit-Mac-M1.zip
          dist/LabFit-Linux.zip
        if-no-files-found: ignore
