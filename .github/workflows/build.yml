name: Build LabFit

on: 
  push:
    tags:
      - 'v*' # Triggers ONLY when you push a tag like v1.0 or v2.1.3
  workflow_dispatch: # Keeps the manual "Run workflow" button

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy matplotlib PyQt5 pyinstaller
        
    - name: Build with PyInstaller
      run: |
        pyinstaller LabFit.spec

    - name: Fix Mac Binary (Make executable)
      if: matrix.os == 'macos-latest'
      run: |
        chmod +x dist/LabFit

    # 1. RENAME the files so they have extensions (.exe, .app, linux)
    - name: Rename artifacts
      shell: bash
      run: |
        if [ "${{ matrix.os }}" = "windows-latest" ]; then
          mv dist/LabFit.exe dist/LabFit-Windows.exe
        elif [ "${{ matrix.os }}" = "macos-latest" ]; then
          mv dist/LabFit dist/LabFit-Mac
        else
          mv dist/LabFit dist/LabFit-Linux
        fi

    # 2. UPLOAD them as temporary workflow artifacts
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: LabFit-${{ matrix.os }}
        path: |
          dist/LabFit-Windows.exe
          dist/LabFit-Mac
          dist/LabFit-Linux
        if-no-files-found: ignore

  # 3. AUTOMATIC RELEASE JOB
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') # Only run if a tag was pushed
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/LabFit-Windows.exe
            artifacts/LabFit-Mac
            artifacts/LabFit-Linux
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
